# Marketplace requires a name that is unique among actions AND does not match
# any GitHub user or organization — that is why this tool cannot be listed
# under a name some user account already owns. The listing is published under
# the repository's own name, so `name` here and `uses: emrelab/go-flake-hunter@<ref>`
# in a consumer's workflow must stay identical: a consumer searches the listing
# and then writes the ref.
name: go-flake-hunter
description: Finds flaky failures in Go tests, reduces them to the smallest witness and produces capsules
author: emrelab

branding:
  icon: activity
  color: orange

inputs:
  paths:
    description: Packages to scan (in go test argument form)
    required: false
    default: ./...
  budget:
    description: Total go test run budget
    required: false
    default: "200"
  timeout:
    description: Total time budget (Go duration), checked between runs
    required: false
    default: 10m
  format:
    description: Report format (text|markdown|json)
    required: false
    default: markdown
  fail-on-flake:
    description: Turn the job red when a flake is found (true/false)
    required: false
    default: "false"
  github-token:
    description: Token used to download the prebuilt release binary
    required: false
    default: ${{ github.token }}
  artifact-name:
    description: Override the capsule artifact name for multiple invocations in the same job
    required: false
    default: ""
  upload-sarif:
    description: "Upload findings as SARIF to GitHub code scanning (needs security-events: write)"
    required: false
    default: "false"

outputs:
  report:
    description: Path of the report file
    value: ${{ steps.hunt.outputs.report }}
  flakes:
    description: Number of flakes found
    value: ${{ steps.hunt.outputs.flakes }}

runs:
  using: composite
  steps:
    # Prebuilt fast path: when the action is used at a release tag, try that
    # tag's published binary (release.yml builds one per platform from the
    # same tag), so the ref the user wrote is still exactly the version that
    # runs. Anything unexpected — branch/SHA ref, missing asset, checksum
    # mismatch, version stamp disagreeing, no gh CLI — exits 0 without
    # claiming the install, and the source build below runs untouched.
    - name: install prebuilt go-flake-hunter
      id: prebuilt
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -uo pipefail
        dir="$RUNNER_TEMP/fs-prebuilt"

        # github.action_ref is this action's own ref: v0.1.0 when the user
        # wrote @v0.1.0, a branch name or SHA otherwise. Only a version tag
        # names a release; everything else has no fixed published identity.
        case "$ACTION_REF" in
          v[0-9]*) ;;
          *) echo "ref '$ACTION_REF' is not a release tag; building from source"; exit 0 ;;
        esac
        version="${ACTION_REF#v}"

        case "$RUNNER_OS" in
          Linux)   goos=linux ;;
          macOS)   goos=darwin ;;
          Windows) goos=windows ;;
          *) echo "OS '$RUNNER_OS' has no prebuilt target; building from source"; exit 0 ;;
        esac
        case "$RUNNER_ARCH" in
          X64)   goarch=amd64 ;;
          ARM64) goarch=arm64 ;;
          *) echo "arch '$RUNNER_ARCH' has no prebuilt target; building from source"; exit 0 ;;
        esac
        asset="go-flake-hunter-$version-$goos-$goarch"
        exe="go-flake-hunter"
        if [ "$goos" = windows ]; then asset="$asset.exe"; exe="go-flake-hunter.exe"; fi

        command -v gh >/dev/null 2>&1 || { echo "no gh CLI; building from source"; exit 0; }
        rm -rf "$dir"; mkdir -p "$dir"
        # One call, exact patterns: fetching the release tag's assets by name,
        # authenticated with the caller's token (public releases too — gh
        # insists on a token for API access).
        gh release download "$ACTION_REF" --repo emrelab/go-flake-hunter --clobber --dir "$dir" \
          --pattern "$asset" --pattern SHA256SUMS \
          || { echo "release '$ACTION_REF' has no '$asset'; building from source"; exit 0; }

        # A --pattern matching nothing still exits 0; insist both files exist.
        [ -f "$dir/$asset" ] && [ -f "$dir/SHA256SUMS" ] \
          || { echo "download incomplete; building from source"; exit 0; }

        grep "  $asset\$" "$dir/SHA256SUMS" > "$dir/one.sums" \
          || { echo "SHA256SUMS has no '$asset'; building from source"; exit 0; }
        ( cd "$dir"
          if command -v sha256sum >/dev/null 2>&1; then sha256sum -c one.sums
          else shasum -a 256 -c one.sums; fi ) >/dev/null \
          || { echo "checksum mismatch for '$asset'; building from source"; exit 0; }

        # The version stamp is the identity contract: trust the binary's own
        # words, not the URL it came from.
        chmod +x "$dir/$asset"
        "$dir/$asset" version | grep -qx "go-flake-hunter $version" \
          || { echo "'$asset' reports a foreign version; building from source"; exit 0; }

        bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"
        cp "$dir/$asset" "$bin/$exe"
        chmod +x "$bin/$exe"
        echo "$bin" >> "$GITHUB_PATH"
        echo "installed=true" >> "$GITHUB_OUTPUT"
        echo "using prebuilt go-flake-hunter $ACTION_REF ($goos/$goarch)"

    # The action builds from its own source: `uses: emrelab/go-flake-hunter@v0.1.0`
    # says which version is running. `go install ...@latest` could not do this —
    # with no tag it installs nothing, and with a tag the action ref and the
    # running binary could be different versions.
    - name: build go-flake-hunter
      if: steps.prebuilt.outputs.installed != 'true'
      shell: bash
      run: |
        set -euo pipefail
        cd "$GITHUB_ACTION_PATH"
        go build -trimpath -o "$RUNNER_TEMP/bin/go-flake-hunter" ./cmd/go-flake-hunter
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

    - name: hunt flakes
      id: hunt
      shell: bash
      env:
        FS_PATHS: ${{ inputs.paths }}
        FS_BUDGET: ${{ inputs.budget }}
        FS_TIMEOUT: ${{ inputs.timeout }}
        FS_FORMAT: ${{ inputs.format }}
        FS_FAIL: ${{ inputs.fail-on-flake }}
        FS_SARIF: ${{ inputs.upload-sarif }}
      run: |
        set -uo pipefail
        report="$RUNNER_TEMP/go-flake-hunter-report.$FS_FORMAT"
        store=$(mktemp -d "$RUNNER_TEMP/gfh-store.XXXXXX") || exit 10
        stage="$RUNNER_TEMP/capsules/${store##*/}"
        args=(hunt $FS_PATHS --capsule-dir "$store" --format "$FS_FORMAT" --budget "$FS_BUDGET" --timeout "$FS_TIMEOUT")
        [ "$FS_FAIL" = "true" ] && args+=(--fail-on-flake)
        # One hunt, two consumers: the report keeps its format, the SARIF
        # side file goes to code scanning. A second hunt would double the
        # budget for the same facts.
        [ "$FS_SARIF" = "true" ] && args+=(--sarif "$RUNNER_TEMP/go-flake-hunter.sarif")

        go-flake-hunter "${args[@]}" | tee "$report"
        status=${PIPESTATUS[0]}

        # Count confirmed capsules only. Suspected and partial findings remain
        # in the artifact but cannot inflate the confirmed flake output.
        case "$FS_FORMAT" in
          json) count=$(grep -c '"status": "confirmed"' "$report" || true) ;;
          *)    count=$(grep -Ec '^(### flake:|flake found:)' "$report" || true) ;;
        esac
        echo "flakes=${count:-0}" >> "$GITHUB_OUTPUT"
        echo "report=$report" >> "$GITHUB_OUTPUT"
        shopt -s nullglob
        capsules=("$store"/gfh_*.json)
        if [ "${#capsules[@]}" -gt 0 ]; then
          mkdir -p "$stage" && cp "${capsules[@]}" "$stage/" || exit 10
          echo "capsules=$stage" >> "$GITHUB_OUTPUT"
        fi

        # Exit code contract: 0 clean, 1 flake (gate), 3 not found in repro,
        # 4 budget, 5 unsupported, 6 build. hunt returns 0 when clean.
        exit "$status"

    - name: add report to job summary
      if: always()
      shell: bash
      env:
        FS_FORMAT: ${{ inputs.format }}
      run: |
        report="$RUNNER_TEMP/go-flake-hunter-report.$FS_FORMAT"
        if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi

    # Opt-in code scanning. SARIF findings ANNOTATE — they never redden the
    # job by themselves; the gate stays the explicit fail-on-flake input.
    # The calling workflow must grant security-events: write; upload-sarif
    # fails loudly without it.
    - name: upload SARIF
      if: always() && inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ runner.temp }}/go-flake-hunter.sarif
        category: go-flake-hunter

    - name: save capsules
      if: always() && steps.hunt.outputs.capsules != ''
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name || format('go-flake-hunter-capsules-{0}-{1}-{2}', github.job, strategy.job-index || '0', github.run_attempt) }}
        path: ${{ steps.hunt.outputs.capsules }}
        if-no-files-found: error
        retention-days: 30
