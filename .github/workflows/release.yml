name: release

# Prebuilt binaries (issue #3): pushing a v* tag publishes one static binary
# per platform plus a SHA256SUMS file as a GitHub Release. The action keeps
# building from source as its fallback, so a missing or broken release never
# blocks a consumer. workflow_dispatch runs the same builds and publishes
# nothing — the way to prove the matrix before cutting a real tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_RELEASE_VERSION: '1.26.11'
  GOTOOLCHAIN: local

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_RELEASE_VERSION }}
          cache: false
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: make fixtures

  build:
    needs: test
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      # One entry per release target. Each is built natively: cross-compiling
      # from one box is possible but a native runner is the honest proof the
      # target compiles. windows/arm64 is intentionally absent — no hosted
      # runner ships it, and the action's source-build fallback covers it.
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    # Windows runners default to pwsh; every script here is POSIX.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_RELEASE_VERSION }}
          # Zero dependencies, so there is no module cache worth restoring —
          # and v7's default cache looks for go.sum, which this module has not.
          cache: false

      # The binary must be able to name its own version: main.version is
      # stamped from the tag (v0.2.0 -> 0.2.0), the same ldflags the Makefile
      # uses. A dry run has no tag, so git describe stands in.
      - name: version
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
          fi

      - name: build
        id: binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          suffix=""
          [ "$GOOS" = windows ] && suffix=".exe"
          out="dist/go-flake-hunter-$VERSION-$GOOS-$GOARCH$suffix"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=$VERSION" \
            -o "$out" ./cmd/go-flake-hunter
          # Run the version stamp back only on the host platform: a darwin
          # amd64 binary on an arm64 runner would need Rosetta, which the
          # macOS images do not promise.
          if [ "$GOOS" = "$(go env GOHOSTOS)" ] && [ "$GOARCH" = "$(go env GOHOSTARCH)" ]; then
            "./$out" version | grep -q "go-flake-hunter $VERSION"
          else
            echo "cross build: skipping the run check for $GOOS/$GOARCH"
          fi

      - uses: anchore/sbom-action@v0.24.3
        with:
          file: ${{ steps.binary.outputs.path }}
          output-file: ${{ steps.binary.outputs.path }}.spdx.json
          format: spdx-json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/attest@v4
        if: github.event_name == 'push'
        with:
          subject-path: ${{ steps.binary.outputs.path }}
      - uses: actions/attest@v4
        if: github.event_name == 'push'
        with:
          subject-path: ${{ steps.binary.outputs.path }}
          sbom-path: ${{ steps.binary.outputs.path }}.spdx.json

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/go-flake-hunter-*
          if-no-files-found: error

  publish:
    # Tag pushes only. A dispatched dry run has no tag to point a release at,
    # and inventing one from a branch name would publish an identity nothing
    # built. The build job above already proved the matrix.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      # One line per binary: "<sha256>  go-flake-hunter-<version>-<os>-<arch>".
      # The action verifies the binary it downloads against exactly this file.
      - name: checksums
        run: (cd dist && sha256sum go-flake-hunter-* > SHA256SUMS)

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # --repo is not decoration: this job checks out nothing, and gh
          # resolves the repository from a git working tree otherwise
          # ("failed to run git: fatal: not a git repository" — v0.2.0).
          #
          # --notes-from-tag, not --generate-notes: the release notes are the
          # annotated tag message, which is the one place a release can say WHY
          # a version is breaking. --generate-notes lists merged PR titles and
          # silently discards that message — v0.3.0 shipped a release page
          # containing nothing but the compare link. CONTRIBUTING.md "Releasing"
          # states the tag requirement this step depends on.
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --notes-from-tag \
            --title "go-flake-hunter $GITHUB_REF_NAME"
