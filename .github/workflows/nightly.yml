name: nightly

# The full -count=10 repeat sweep on all three OSes. On PRs ci.yml runs
# -count=3 on the unit/probe packages and the integration layer
# (internal/cli/...) once; a leak that only surfaces on the 7th run, or one
# that needs repeats in the subprocess-driven layer, is the nightly's job.
# Local equivalent: `make test-repeat`.

on:
  schedule:
    - cron: '0 21 * * *' # 00:00 UTC+3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeat-sweep:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ceilings are measured, not guessed. Full-run wall time at -count=10
          # on run 43717279232: ubuntu 18.8m, macos 30.5m, windows 69.3m.
          # The earlier 45m failed on windows (panic: test timed out after
          # 45m0s, three packages at 2700s), and 90m left only 1.3x headroom
          # against a 2.2x run-to-run variance (a previous windows run of the
          # same suite finished in 31m). 120m is 1.7x over the high sample.
          # The count stays 10: the 7th-run leak this job exists for lives at
          # count 7-10, so lowering it would trade the signal for the clock.
          - os: ubuntu-latest
            timeout: 45m
          - os: macos-latest
            timeout: 45m
          - os: windows-latest
            timeout: 120m
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          # Zero dependencies, so there is no module cache worth restoring —
          # and v7's default cache looks for go.sum, which this module has not.
          cache: false
      - name: test (full repeat sweep)
        run: go test -timeout ${{ matrix.timeout }} -count=10 ./...

  # The ci.yml self-hunt runs with --short so a PR budget is not spent on
  # integration tests. This is the sweep that promise deferred to: no
  # --short, a generous wall budget, the full package set — integration
  # tests included. An order-dependent flake hiding in a slow test is the
  # nightly's to catch, same as a leak on the 7th repeat.
  self-hunt-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          # Zero dependencies, so there is no module cache worth restoring —
          # and v7's default cache looks for go.sum, which this module has not.
          cache: false
      - name: build
        run: make build
      - name: hunt our own packages (full)
        id: hunt
        run: |
          set -uo pipefail
          rc=0
          # --run-timeout: without it a package whose own suite needs more than
          # the 2m default can never be scanned. internal/cli/compile,
          # internal/cli/hunt and internal/cli/huntci spawn `go test` themselves
          # and take ~85 s per run: every hypothesis came back "test run
          # incomplete" and the job exited 7 for three named packages on
          # 2026-11-15.
          #
          # The `go list` filter is the second half of the same problem, and it
          # is measured, not defensive. Those six packages are test-only
          # (ARCHITECTURE §11.5) — no product code — and a hunt re-runs each of
          # them once per hypothesis and once per shuffle seed. With them
          # included the scan spent 57m50s of the 60m wall and still reported
          # internal/cli/compile as incomplete; the budget went to re-running
          # test harnesses, not to finding defects in the tool.
          #
          # Nothing is lost: repeat-sweep above exercises exactly these packages
          # at -count=10 on three OSes, and `make test` runs them once. When one
          # of them does go flaky, that job names it and `go test -shuffle` on
          # the reported seed is the reproducer.
          pkgs=()
          while IFS= read -r p; do pkgs+=("$p"); done < <(go list ./... | grep -vE 'internal/cli/(compile|hunt|huntci|huntevidence|replay|surface)$')
          ./go-flake-hunter hunt "${pkgs[@]}" --capsule-dir "$RUNNER_TEMP/capsules" --fail-on-flake --budget 2000 --timeout 60m --run-timeout 10m || rc=$?
          shopt -s nullglob
          capsules=("$RUNNER_TEMP"/capsules/gfh_*.json)
          if [ "${#capsules[@]}" -gt 0 ]; then echo "capsules=true" >> "$GITHUB_OUTPUT"; fi
          if [ "$rc" -eq 4 ]; then
            echo "::warning::full self-hunt ran out of budget — raise --budget/--timeout or file it"
          fi
          exit "$rc"
      - name: save capsules
        if: always() && steps.hunt.outputs.capsules == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nightly-hunt-capsules-${{ strategy.job-index || '0' }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/capsules/gfh_*.json
          if-no-files-found: error
          retention-days: 14
