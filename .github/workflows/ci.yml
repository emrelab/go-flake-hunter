name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The Windows runner's default shell is pwsh; the steps assume POSIX scripts
    # (make, $(...) capture, ./go-flake-hunter). Pinned to bash in one place.
    defaults:
      run:
        shell: bash
    steps:
      # Windows runner images ship git with core.autocrlf=true; checkout would
      # write CRLF working trees and gofmt would flag every file. Env-level git
      # config (GIT_CONFIG_COUNT, git >= 2.31) outranks the image's system
      # gitconfig for the checkout process, so files materialize with LF.
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          # Zero dependencies, so there is no module cache worth restoring —
          # and v7's default cache looks for go.sum, which this module has not.
          cache: false

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: vet
        run: go vet ./...

      - name: test
        # Explicit timeout, not the 10m default: this suite spawns real
        # `go test` subprocesses, so its wall time follows the runner's disk
        # and CPU, not the assertion count. Measured on the slowest runner
        # (windows-latest): 4m06s — 15m is ~3.5x headroom.
        run: go test -timeout 15m -race ./...

      # The tool itself must not produce flakes. A state leak is caught here.
      #
      # Where the repeat sweep applies, and why not everywhere: -count=N exists
      # to surface state that survives between runs inside one process. That is
      # cheap and decisive in the unit and probe packages. The integration layer
      # (internal/cli/...) instead spawns real `go test` subprocesses; repeating
      # it three times per OS multiplied the spawns by three for no signal — no
      # CI failure to date came from a repeat-only leak there — while the
      # nightly's `-count=10` sweep covers the same ground better. PR runs it
      # once; nightly repeats it.
      #
      # Measured on windows-latest before this split: the sweep step was 13-18m.
      - name: test (repeat, flake hunt)
        run: |
          # -timeout applies per package; the sweep multiplies the subprocess
          # spawns, so keep the headroom the old single invocation had.
          go test -timeout 30m -count=3 $(go list ./... | grep -v '/internal/cli')
          go test -timeout 15m -count=1 ./internal/cli/...

      - name: fixtures
        run: make fixtures

      - name: build
        run: make build

      - name: smoke (help)
        run: ./go-flake-hunter help

  # go.mod's floor is go 1.24 (measured: `t.Chdir` in the cli tests is the
  # newest API used). This job proves the floor on a real 1.24 toolchain
  # instead of trusting the directive. Unit tests only (-short): the
  # fixture-driven integration tests drive a modern toolchain end to end and
  # belong to the 1.26 job.
  oldest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false
      - name: vet
        run: go vet ./...
      - name: build
        run: make build
      - name: unit tests
        run: go test -race -short ./...

  # Gates that need one OS, not three: lint, the Action's step scripts, and the
  # vulnerability scan. Pinned module versions, not @latest: a CI tool that
  # drifts silently is the same defect as an unpinned action ref.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false

      - name: lint
        run: |
          set -euo pipefail
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "$(go env GOPATH)/bin/golangci-lint" run ./...

      # action.yml's step scripts, proven locally without GitHub. Kept out of
      # the Windows/macOS matrix: the script is bash, and a green smoke there
      # would only prove Git Bash, which is not the action's runtime.
      - name: action smoke
        run: make smoke

      - name: govulncheck
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  # Dogfooding: our own tool hunts flakes in our own repo. If a witness file
  # or a leaked global makes our suite order-dependent, this step goes red.
  # Exit 4 (budget exhausted) is inconclusive, not a failure: it warns and
  # lets the nightly sweep carry the full load.
  self-hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          # Zero dependencies, so there is no module cache worth restoring —
          # and v7's default cache looks for go.sum, which this module has not.
          cache: false
      - name: build
        run: make build
      - name: hunt our own packages
        run: |
          set -uo pipefail
          # --short: our own cli package carries heavy integration tests that
          # skip themselves under testing.Short(); without the flag the
          # shuffle scan re-runs them per seed and the PR budget is spent on
          # tests the next CI step already covers in full. Nightly runs the
          # hunt without --short — the comment below must stay true.
          # || rc=$? on purpose: the default shell is bash -e, and a bare
          # failing line kills the script BEFORE rc can be read. The guard
          # below was dead code until that was noticed (self-hunt @ d92e895).
          rc=0
          # 600 runs: the sweep's run count is deterministic; measured on the
          # current tree at just under that. 15m wall for slower runners.
          ./go-flake-hunter hunt ./... --fail-on-flake --short --budget 600 --timeout 15m || rc=$?
          if [ "$rc" -eq 4 ]; then
            echo "::warning::self-hunt ran out of budget — inconclusive, nightly carries the sweep"
            exit 0
          fi
          exit "$rc"
      - name: save capsules
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: self-hunt-capsules
          path: "**/.go-flake-hunter/*.json"
          if-no-files-found: ignore
          retention-days: 14

  # The README is a claim about the binary. This job makes the claim testable.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # the tag check needs the tags
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false
      - name: build
        run: make build
      - name: docs drift
        run: scripts/docs-drift.sh
