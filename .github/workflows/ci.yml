name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.24', '1.26']
    runs-on: ${{ matrix.os }}
    # The Windows runner's default shell is pwsh; the steps assume POSIX scripts
    # (make, $(...) capture, ./go-flake-hunter). Pinned to bash in one place.
    defaults:
      run:
        shell: bash
    steps:
      # Windows runner images ship git with core.autocrlf=true; checkout would
      # write CRLF working trees and gofmt would flag every file. Env-level git
      # config (GIT_CONFIG_COUNT, git >= 2.31) outranks the image's system
      # gitconfig for the checkout process, so files materialize with LF.
      - uses: actions/checkout@v7
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          # Zero dependencies, so there is no module cache worth restoring —
          # and v7's default cache looks for go.sum, which this module has not.
          cache: false

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: vet
        run: go vet ./...

      - name: test
        # Explicit timeout, not the 10m default: this suite spawns real
        # `go test` subprocesses, so its wall time follows the runner's disk
        # and CPU, not the assertion count. Measured on the slowest runner
        # (windows-latest): 4m06s — 15m is ~3.5x headroom.
        run: go test -timeout 15m -race -count=1 -v ./...

      - name: native cancellation and console regressions
        env:
          CGO_ENABLED: '1'
        run: |
          go test -race -timeout 5m -count=3 -v -run 'Test(CancellationStopsDescendants|DeadlineStopsDescendants|StoreSizeBoundaryRoundTrip|StorePartialWritePreservesEvidence|WindowsKeyRecords)$' ./internal/gotest ./internal/capsule ./internal/terminal
          if [ "$RUNNER_OS" = Windows ]; then
            go test -race -timeout 5m -count=3 -v -run 'TestWindows(Job|Console)' ./internal/gotest ./internal/terminal
          fi

      # The tool itself must not produce flakes. A state leak is caught here.
      #
      # Where the repeat sweep applies, and why not everywhere: -count=N exists
      # to surface state that survives between runs inside one process. That is
      # cheap and decisive in the unit and probe packages. The integration layer
      # (internal/cli/...) instead spawns real `go test` subprocesses; repeating
      # it three times per OS multiplied the spawns by three for no signal — no
      # CI failure to date came from a repeat-only leak there — while the
      # nightly's `-count=10` sweep covers the same ground better. PR runs it
      # once; nightly repeats it.
      #
      # Measured on windows-latest before this split: the sweep step was 13-18m.
      - name: test (repeat, flake hunt)
        run: |
          # -timeout applies per package; the sweep multiplies the subprocess
          # spawns, so keep the headroom the old single invocation had.
          packages=()
          while IFS= read -r pkg; do packages+=("$pkg"); done < <(go list ./... | grep -v '/internal/cli')
          go test -timeout 30m -count=3 "${packages[@]}"
          go test -timeout 15m -count=1 ./internal/cli/...

      - name: fixtures
        if: matrix.go != '1.24'
        run: make fixtures

      - name: fixtures compatible with Go 1.24
        if: matrix.go == '1.24'
        run: |
          for dir in testdata/fixtures/*/; do
            if [ "$dir" = testdata/fixtures/synctest-bubble/ ]; then
              echo "::notice::synctest-bubble requires Go 1.26 and is validated in the Go 1.26 jobs"
              continue
            fi
            echo "== $dir"
            (cd "$dir" && go build ./... && go vet ./...) || exit 1
          done

      - name: build
        run: make build

      - name: smoke (help)
        run: ./go-flake-hunter help

  # The native matrix covers the Go 1.24 floor and the release toolchain.
  # Intermediate and current Go versions exercise the full suite once on Linux.
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25', '1.27']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: vet
        run: go vet ./...
      - name: build
        run: make build
      - name: full race suite
        run: go test -race -timeout 15m -count=1 -v ./...

  # Gates that need one OS, not three: lint, the Action's step scripts, and the
  # vulnerability scan. Pinned module versions, not @latest: a CI tool that
  # drifts silently is the same defect as an unpinned action ref.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false

      - name: lint
        run: |
          set -euo pipefail
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "$(go env GOPATH)/bin/golangci-lint" run ./...

      # action.yml's step scripts, proven locally without GitHub. Kept out of
      # the Windows/macOS matrix: the script is bash, and a green smoke there
      # would only prove Git Bash, which is not the action's runtime.
      - name: action smoke
        env:
          GFH_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/smoke-capsules
        run: make smoke
      - name: interactive terminal smoke
        env:
          GOFLAGS: -race
        run: make tui-smoke
      - uses: actions/upload-artifact@v7
        id: upload-smoke-capsule
        with:
          name: smoke-capsule-${{ github.run_attempt }}
          path: ${{ runner.temp }}/smoke-capsules/gfh_*.json
          if-no-files-found: error
      - name: download smoke capsule with retry
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload-smoke-capsule.outputs.artifact-id }}
        run: |
          set -euo pipefail
          # Bounded retry for GitHub Actions artifact visibility lag.
          # The artifact upload succeeds but internal indexing may not
          # immediately make it available via artifact-ids lookup.
          # Retry with increasing backoff using GitHub REST API.
          # Delays: 5, 15, 30, 60 seconds (max 4 attempts).
          attempts=0
          max_attempts=4
          delays=(5 15 30 60)
          mkdir -p "$RUNNER_TEMP/smoke-downloaded"
          while [ $attempts -lt $max_attempts ]; do
            if gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" \
              > "$RUNNER_TEMP/smoke-downloaded/artifact.zip" 2>&1; then
              unzip -q -o "$RUNNER_TEMP/smoke-downloaded/artifact.zip" -d "$RUNNER_TEMP/smoke-downloaded"
              rm "$RUNNER_TEMP/smoke-downloaded/artifact.zip"
              echo "Artifact downloaded successfully on attempt $((attempts + 1))"
              break
            fi
            attempts=$((attempts + 1))
            if [ $attempts -eq $max_attempts ]; then
              echo "All $max_attempts download attempts failed" >&2
              exit 1
            fi
            echo "Attempt $attempts failed, waiting ${delays[$attempts - 1]}s before retry..." >&2
            sleep "${delays[$attempts - 1]}"
          done
      - name: verify capsule round trip
        run: |
          set -euo pipefail
          shopt -s nullglob
          capsules=("$RUNNER_TEMP"/smoke-downloaded/gfh_*.json)
          test "${#capsules[@]}" = 1
          cmp "${capsules[0]}" "$RUNNER_TEMP/smoke-capsules/${capsules[0]##*/}"

      - name: govulncheck
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      # The audit's P0.0 list asks CI to publish the coverage total. No
      # threshold: a number nobody agreed on would either be ignored or
      # block honest work; the trend is what the baseline is for.
      - name: coverage
        run: make cover

  # Dogfooding: our own tool hunts flakes in our own repo. If a witness file
  # or a leaked global makes our suite order-dependent, this step goes red.
  # The scan must finish: a budget-exhausted result is inconclusive and fails
  # this gate instead of turning an incomplete scan into a green check.
  self-hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          # Zero dependencies, so there is no module cache worth restoring —
          # and v7's default cache looks for go.sum, which this module has not.
          cache: false
      - name: build
        run: make build
      - name: hunt our own packages
        id: hunt
        run: |
          set -uo pipefail
          # --short: our own cli package carries heavy integration tests that
          # skip themselves under testing.Short(); without the flag the
          # shuffle scan re-runs them per seed and the PR budget is spent on
          # tests the next CI step already covers in full. Nightly runs the
          # hunt without --short — the comment below must stay true.
          # || rc=$? on purpose: the default shell is bash -e, and a bare
          # failing line kills the script BEFORE rc can be read. The guard
          # below was dead code until that was noticed (self-hunt @ d92e895).
          rc=0
          # The expanded suite exceeds the former 600-run ceiling. Use the
          # normal 1000-run budget and require completion, with 15m wall time.
          ./go-flake-hunter hunt ./... --capsule-dir "$RUNNER_TEMP/capsules" --fail-on-flake --short --budget 1000 --timeout 15m || rc=$?
          shopt -s nullglob
          capsules=("$RUNNER_TEMP"/capsules/gfh_*.json)
          if [ "${#capsules[@]}" -gt 0 ]; then echo "capsules=true" >> "$GITHUB_OUTPUT"; fi
          exit "$rc"
      - name: save capsules
        if: always() && steps.hunt.outputs.capsules == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: self-hunt-capsules-${{ strategy.job-index || '0' }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/capsules/gfh_*.json
          if-no-files-found: error
          retention-days: 14

  # The README is a claim about the binary. This job makes the claim testable.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # the tag check needs the tags
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false
      - name: build
        run: make build
      - name: docs drift
        run: scripts/docs-drift.sh
